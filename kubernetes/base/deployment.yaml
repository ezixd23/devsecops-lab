apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-lab
  template:
    metadata:
      labels:
        app: devsecops-lab
    spec:
      serviceAccountName: devsecops-lab
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/ezixd23/devsecops-lab
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: app-secret
              mountPath: /etc/app-secret
              readOnly: true
      volumes:
        - name: app-secret
          secret:
            secretName: app-secret
